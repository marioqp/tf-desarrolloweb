<div class="workspace">
    <app-sidebar></app-sidebar>

    <main class="main">
    <app-navbar title="Todas las solicitudes" subtitle="Busca y filtra la lista"></app-navbar>

    <section class="contenido">
        <div class="tabs">
        <button [class.activa]="!soloMias" (click)="soloMias = false">Todas</button>
        <button [class.activa]="soloMias" (click)="soloMias = true">
            Mis solicitudes ({{ cantidadMias() }})
        </button>
        </div>

        <div class="caja filtros">
        <input type="text" placeholder="Buscar por código (SOL-0000)" [(ngModel)]="busqueda" />

        <select [(ngModel)]="estado">
            <option value="">Estado: Todos</option>
            <option>Pendiente</option>
            <option>En atención</option>
            <option>En espera</option>
            <option>Cerrada</option>
        </select>

        <select [(ngModel)]="tipo">
            <option value="">Tipo: Todos</option>
            <option>Incidencia</option>
            <option>Cambio de configuración</option>
            <option>Falla del producto</option>
            <option>Capacitación</option>
        </select>

        <select [(ngModel)]="prioridad">
            <option value="">Prioridad: Todas</option>
            <option>Alta</option>
            <option>Media</option>
            <option>Baja</option>
        </select>

        <button class="btn-blanco" (click)="limpiar()">Limpiar filtros</button>
        </div>

        <div class="caja">
        <table>
            <tr>
            <th>Código</th>
            <th>Cliente</th>
            <th>Tipo</th>
            <th>Estado</th>
            <th>Prioridad</th>
            <th>Técnico</th>
            <th></th>
            </tr>

        @for (s of filtrar(); track s.codigo) {
            <tr>
                <td><b>{{ s.codigo }}</b></td>
                <td>{{ s.cliente }}</td>
                <td>{{ s.tipo }}</td>
                <td><span class="badge" [attr.data-valor]="s.estado">{{ s.estado }}</span></td>
                <td><span class="badge" [attr.data-valor]="s.prioridad">{{ s.prioridad }}</span></td>
                <td>{{ s.tecnico }}</td>
                <td><a class="abrir" [routerLink]="['/solicitudes', s.codigo]">Abrir</a></td>
            </tr>
            } @empty {
            <tr><td colspan="7" class="vacio">No se encontraron solicitudes</td></tr>
            }
        </table>
        </div>
    </section>
    </main>
</div>
